name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore D2Translator.slnx

      - name: Build
        run: dotnet build D2Translator.slnx --no-restore -c Release

      # 英語 OCR の言語機能がない環境では OCR の結合試験はスキップになる
      - name: Test
        run: dotnet test D2Translator.slnx --no-build -c Release
